[build]
  command = "npm run build"
  publish = "dist"

# Всё, чего нет в новом сайте (/phuket, /shop, документы…), отдаём из Tilda.
# Без force: правило срабатывает, только если такого файла в dist нет.
[[redirects]]
  from = "/*"
  to = "https://project4207141.tilda.ws/:splat"
  status = 200

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
