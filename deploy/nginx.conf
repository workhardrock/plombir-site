# Пример для своего сервера (Timeweb, Selectel и т. п.).
# Новый сайт — файлы из dist/, всё остальное проксируется в Tilda.
server {
    listen 443 ssl http2;
    server_name plombir.events www.plombir.events;

    # ssl_certificate     /etc/letsencrypt/live/plombir.events/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plombir.events/privkey.pem;

    root /var/www/plombir/dist;
    index index.html;

    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / {
        try_files $uri $uri/ $uri/index.html @tilda;
    }

    location @tilda {
        proxy_pass https://project4207141.tilda.ws;
        proxy_set_header Host project4207141.tilda.ws;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect https://project4207141.tilda.ws/ /;
    }
}

server {
    listen 80;
    server_name plombir.events www.plombir.events;
    return 301 https://plombir.events$request_uri;
}
